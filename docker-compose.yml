version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: doctor_emr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doctor_emr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - doctor_emr_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: doctor_emr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doctor_emr_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor_emr_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/doctor_emr
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: your-nextauth-secret-key
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - doctor_emr_network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: doctor_emr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - doctor_emr_network

volumes:
  postgres_data:
  redis_data:

networks:
  doctor_emr_network:
    driver: bridge
